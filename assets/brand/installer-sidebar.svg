<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314" role="img" aria-labelledby="title desc">
  <title id="title">What Changed installer sidebar</title>
  <desc id="desc">Dark installer sidebar with the Delta Bridge mark, product name and established product tagline.</desc>
  <rect width="164" height="314" fill="#0B0E14"/>
  <rect x="24" y="24" width="116" height="1" fill="#3A4459"/>
  <!-- The mark uses the canonical 256-unit geometry. -->
  <g transform="translate(34 39) scale(0.375)">
    <rect width="256" height="256" rx="56" fill="#0B0E14"/>
    <rect x="52" y="73" width="106" height="30" rx="15" fill="#3A4459"/>
    <rect x="98" y="153" width="106" height="30" rx="15" fill="#4FA3FF"/>
    <rect x="120" y="103" width="15" height="50" rx="7.5" fill="#E6E9EF"/>
  </g>
  <text x="24" y="175" fill="#E6E9EF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">What</text>
  <text x="24" y="201" fill="#E6E9EF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Changed</text>
  <rect x="24" y="221" width="42" height="3" rx="1.5" fill="#4FA3FF"/>
  <text x="24" y="252" fill="#B9C4D3" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">It worked before.</text>
  <text x="24" y="269" fill="#B9C4D3" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">What changed?</text>
  <rect x="24" y="289" width="116" height="1" fill="#3A4459"/>
</svg>
